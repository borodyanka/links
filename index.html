<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бородянська селищна рада</title>
    <!-- Заміна планетки на герб Бородянки у вкладці браузера -->
    <link rel="icon" type="image/jpeg" href="gerb.jpg">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <!-- Герб та заголовок -->
        <div class="profile-header">
            <img src="gerb.jpg" alt="Герб Бородянської селищної ради" class="coat-of-arms">
            <h1>Бородянська селищна рада</h1>
            <p>Офіційні медіаресурси</p>
        </div>

        <!-- Список кнопок-посилань -->
        <div class="links-list">
            
            <!-- Офіційний веб-сайт -->
            <a href="https://bsr.gov.ua/" class="link-card main-site" target="_blank" rel="noopener noreferrer" aria-label="Перейти на офіційний веб-сайт Бородянської селищної ради">
                <span class="link-title">Веб-сайт</span>
                <span class="link-desc">bsr.gov.ua — Новини, рішення, оголошення</span>
            </a>

            <!-- Telegram -->
            <a href="https://t.me/borodyanka_official" class="link-card" target="_blank" rel="noopener noreferrer" aria-label="Перейти до Telegram-каналу">
                <span class="link-title">Telegram</span>
                <span class="link-desc"></span>
            </a>

            <!-- Facebook -->
            <a href="https://www.facebook.com/share/1BmdgQkuEz" class="link-card" target="_blank" rel="noopener noreferrer" aria-label="Перейти на сторінку Facebook">
                <span class="link-title">Facebook</span>
                <span class="link-desc"></span>
            </a>

            <!-- Instagram -->
            <a href="https://www.instagram.com/borodyanka_official?igsh=MWRuY280ZnNxcjZidw" class="link-card" target="_blank" rel="noopener noreferrer" aria-label="Перейти до профілю Instagram">
                <span class="link-title">Instagram</span>
                <span class="link-desc"></span>
            </a>

        </div>

        <!-- Підвал -->
        <footer class="footer">
            <p>© 2026 Бородянська селищна рада</p>
        </footer>
    </main>

</body>
</html>
